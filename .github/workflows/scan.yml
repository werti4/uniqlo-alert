name: Scanner UNIQLO

on:
  schedule:
    # GitHub may delay or omit scheduled runs. These are requested start times.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/watchlist.enc.json'
      - 'scanner/**'
      - '.github/workflows/scan.yml'
      - 'requirements.txt'

concurrency:
  group: uniqlo-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    # Manual runs on another branch must not overwrite the production history.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Vérifier la configuration sans exposer de secret
        id: configuration
        env:
          UA_ENCRYPTION_KEY: ${{ secrets.UA_ENCRYPTION_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: python
        run: |
          import os
          from pathlib import Path

          missing = []
          if not os.environ.get('UA_ENCRYPTION_KEY'):
              missing.append('le secret Actions UA_ENCRYPTION_KEY')
          if not Path('data/watchlist.enc.json').is_file():
              missing.append('les favoris chiffrés publiés depuis l’extension')
          ready = not missing
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'ready={str(ready).lower()}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              if not ready:
                  summary.write('## Configuration requise — surveillance inactive\n\n')
                  summary.write('Il manque :\n\n' + ''.join(f'- {item}\n' for item in missing))
                  summary.write('\nAucune requête UNIQLO et aucun historique créé. Consultez le guide du dépôt.\n')
              else:
                  summary.write('## Configuration minimale présente\n\n')
                  summary.write('Le scanner peut démarrer ; son résultat est indiqué dans les étapes suivantes.\n')
              telegram = bool(os.environ.get('TELEGRAM_BOT_TOKEN') and os.environ.get('TELEGRAM_CHAT_ID'))
              if not telegram:
                  summary.write('\n**Notifications iPhone non configurées.** Ajoutez les secrets Actions TELEGRAM_BOT_TOKEN et TELEGRAM_CHAT_ID.\n')
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.configuration.outputs.ready == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Installer le lecteur
        if: steps.configuration.outputs.ready == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Scanner les favoris
        id: scanner
        if: steps.configuration.outputs.ready == 'true'
        env:
          UA_ENCRYPTION_KEY: ${{ secrets.UA_ENCRYPTION_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scanner/monitor.py
      - name: Résumer le résultat
        if: always() && steps.configuration.outputs.ready == 'true'
        env:
          SCAN_OUTCOME: ${{ steps.scanner.outcome }}
        shell: python
        run: |
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              if os.environ.get('SCAN_OUTCOME') == 'success':
                  summary.write('\n**Scanner terminé.** Consultez les dates de relevé et les statuts chiffrés dans l’extension.\n')
              else:
                  summary.write('\n**Scanner non terminé ou en échec.** Les derniers prix valides restent conservés. Consultez l’extension et les étapes en échec.\n')
              summary.write('\nPlanification demandée : toutes les 15 minutes, avec retards ou omissions possibles côté GitHub.\n')
