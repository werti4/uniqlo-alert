name: Vérifier le projet
on:
  push:
    branches: [main]
    paths: ['extension/**', 'scanner/**', 'tests/**', 'tools/**', 'requirements.txt', 'package.json', '.github/workflows/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: project-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm test
      - name: Générer les icônes incluses dans les sources
        run: python tools/generate_icons.py
      - name: Préparer l’extension installable sans données privées
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          root = Path('extension')
          allowed = [
              'manifest.json', 'app.html', 'app.css', 'app.js', 'core.js', 'background.js',
              'icons/icon16.png', 'icons/icon32.png', 'icons/icon48.png', 'icons/icon128.png',
          ]
          with ZipFile('uniqlo-alert-extension.zip', 'w', ZIP_DEFLATED) as archive:
              for name in allowed:
                  source = root / name
                  if not source.is_file():
                      raise RuntimeError(f'Fichier de l’extension absent : {name}')
                  archive.write(source, name)
          # Explicit allowlist: no bootstrap.private.json, tokens, or demo favorites.
      - name: Télécharger l’extension depuis cette exécution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uniqlo-alert-extension
          path: uniqlo-alert-extension.zip
          if-no-files-found: error
          retention-days: 7
