name: Commandes Telegram

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uniqlo-monitor
  cancel-in-progress: false

jobs:
  commands:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.UA_TELEGRAM_ENABLED == 'true' && (github.event_name != 'schedule' || vars.UA_TELEGRAM_WEBHOOK_URL == '')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Répondre à /logs ou exécuter /scan sur demande privée
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UA_ENCRYPTION_KEY: ${{ secrets.UA_ENCRYPTION_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          UA_TELEGRAM_WEBHOOK_URL: ${{ vars.UA_TELEGRAM_WEBHOOK_URL }}
          UA_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.UA_TELEGRAM_WEBHOOK_SECRET }}
        run: python -m tools.telegram_commands
